<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Western Zébu 3D</title>
    <link rel="stylesheet" href="css/common.css" />
  </head>
  <body>
    <div id="hud">
      <h1>Western Zébu 3D</h1>
      <p id="status">Éliminez les voleurs et atteignez la sortie.</p>
      <p>Vie: <span id="health">100</span> | Voleurs restants: <span id="remaining">0</span></p>
    </div>

    <div id="mobile-controls">
      <div id="joystick-base"><div id="joystick-stick"></div></div>
      <button id="fire-btn">TIR</button>
    </div>

    <script type="module">
      import * as THREE from './js/vendor/three.module.js';

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 25, 75);

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 150);
      camera.position.set(0, 2.2, 7);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const statusEl = document.getElementById('status');
      const healthEl = document.getElementById('health');
      const remainingEl = document.getElementById('remaining');
      const joystickBase = document.getElementById('joystick-base');
      const joystickStick = document.getElementById('joystick-stick');
      const fireBtn = document.getElementById('fire-btn');

      const clock = new THREE.Clock();
      const player = {
        radius: 0.7,
        speed: 10,
        health: 100,
        fireCooldown: 0,
      };

      const walls = [];
      const enemies = [];
      const playerBullets = [];
      const enemyBullets = [];
      const keys = { forward: false, back: false, left: false, right: false };
      const joystick = { active: false, pointerId: null, x: 0, y: 0 };
      let gameWon = false;
      let gameLost = false;

      const light = new THREE.HemisphereLight(0xfff3d1, 0x4b7b45, 1.2);
      scene.add(light);

      const sun = new THREE.DirectionalLight(0xffffff, 1.1);
      sun.position.set(15, 24, 10);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      scene.add(sun);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(80, 80),
        new THREE.MeshStandardMaterial({ color: 0xc8a26d })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      function addWall(x, z, w, d, h = 3, color = 0x7b4f25) {
        const wall = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshStandardMaterial({ color })
        );
        wall.position.set(x, h / 2, z);
        wall.castShadow = true;
        wall.receiveShadow = true;
        wall.userData.size = { w, d, h };
        scene.add(wall);
        walls.push(wall);
      }

      function buildArena() {
        addWall(0, -22, 44, 2);
        addWall(0, 22, 44, 2);
        addWall(-22, 0, 2, 44);
        addWall(22, -8, 2, 28);
        addWall(22, 14, 2, 12);

        addWall(-5, -6, 10, 2, 3.2, 0x8f6a40);
        addWall(9, 2, 2, 12, 3.2, 0x8f6a40);
        addWall(-12, 10, 14, 2, 3.2, 0x8f6a40);

        addWall(-15, 12, 2, 10, 2.8, 0x6f7f39);
        addWall(-5, 12, 2, 10, 2.8, 0x6f7f39);
        addWall(-10, 7, 12, 2, 2.8, 0x6f7f39);
        addWall(-10, 17, 3.5, 2, 2.8, 0x6f7f39);
        addWall(-2, 17, 4.5, 2, 2.8, 0x6f7f39);

        const penLabel = makeBillboard('Enclos à zébu', -10, 4.2, 12);
        scene.add(penLabel);

        const entryLabel = makeBillboard('Entrée', 22, 3.5, 6);
        scene.add(entryLabel);
        const exitLabel = makeBillboard('Sortie', 22, 3.5, 17);
        scene.add(exitLabel);
      }

      function makeBillboard(text, x, y, z) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 96;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffffcc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#3c1d02';
        ctx.font = 'bold 34px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        const texture = new THREE.CanvasTexture(canvas);
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(4.8, 1.8),
          new THREE.MeshBasicMaterial({ map: texture, transparent: true })
        );
        mesh.position.set(x, y, z);
        return mesh;
      }

      function addZebu(x, z) {
        const zebu = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.SphereGeometry(1, 20, 18),
          new THREE.MeshStandardMaterial({ color: 0xe8e3d3 })
        );
        body.position.y = 1.3;
        const hump = new THREE.Mesh(
          new THREE.SphereGeometry(0.45, 16, 14),
          new THREE.MeshStandardMaterial({ color: 0xf3efdf })
        );
        hump.position.set(0, 1.9, -0.3);
        const hornL = new THREE.Mesh(
          new THREE.ConeGeometry(0.12, 0.8, 8),
          new THREE.MeshStandardMaterial({ color: 0x4f3f2a })
        );
        hornL.rotation.z = Math.PI / 3;
        hornL.position.set(-0.65, 1.7, 0.6);
        const hornR = hornL.clone();
        hornR.rotation.z = -Math.PI / 3;
        hornR.position.x = 0.65;

        zebu.add(body, hump, hornL, hornR);
        zebu.position.set(x, 0, z);
        scene.add(zebu);
      }

      function createEnemy(x, z) {
        const enemy = new THREE.Group();

        const body = new THREE.Mesh(
          new THREE.SphereGeometry(0.8, 24, 20),
          new THREE.MeshStandardMaterial({ color: 0xb12828 })
        );
        body.position.y = 1;

        const hatTop = new THREE.Mesh(
          new THREE.CylinderGeometry(0.3, 0.35, 0.35, 16),
          new THREE.MeshStandardMaterial({ color: 0x3b210e })
        );
        hatTop.position.set(0, 2.1, 0);

        const hatBrim = new THREE.Mesh(
          new THREE.CylinderGeometry(0.85, 0.85, 0.08, 20),
          new THREE.MeshStandardMaterial({ color: 0x2b1709 })
        );
        hatBrim.position.set(0, 1.95, 0);

        const gun = new THREE.Mesh(
          new THREE.BoxGeometry(0.12, 0.12, 0.9),
          new THREE.MeshStandardMaterial({ color: 0x1f1f1f })
        );
        gun.position.set(0.8, 1, 0);
        gun.rotation.x = Math.PI / 2;

        enemy.add(body, hatTop, hatBrim, gun);
        enemy.position.set(x, 0, z);
        enemy.userData = {
          radius: 0.9,
          health: 3,
          shootTimer: Math.random() * 2,
          speed: 2.2,
        };

        scene.add(enemy);
        enemies.push(enemy);
      }

      function createPlayerVisual() {
        const playerMesh = new THREE.Group();

        const body = new THREE.Mesh(
          new THREE.SphereGeometry(0.7, 24, 20),
          new THREE.MeshStandardMaterial({ color: 0x2b4ea2 })
        );
        body.position.y = 1;

        const pistol = new THREE.Mesh(
          new THREE.BoxGeometry(0.16, 0.12, 0.75),
          new THREE.MeshStandardMaterial({ color: 0x202020 })
        );
        pistol.position.set(0.75, 1.05, -0.2);

        playerMesh.add(body, pistol);
        playerMesh.position.set(6, 0, 16);
        scene.add(playerMesh);
        return playerMesh;
      }

      const playerMesh = createPlayerVisual();
      buildArena();
      addZebu(-12, 11);
      addZebu(-8, 13.5);
      addZebu(-11, 15.5);

      createEnemy(-4, -11);
      createEnemy(13, -6);
      createEnemy(2, 5);
      createEnemy(15, 12);
      createEnemy(-15, -3);

      remainingEl.textContent = String(enemies.length);

      function resolveInitialPlayerSpawn() {
        if (!collidesWithWall(playerMesh.position, player.radius)) return;

        const safeSpawns = [
          new THREE.Vector3(6, 0, 16),
          new THREE.Vector3(10, 0, 10),
          new THREE.Vector3(0, 0, 18),
          new THREE.Vector3(16, 0, 0),
        ];

        const safe = safeSpawns.find((spot) => !collidesWithWall(spot, player.radius));
        if (safe) {
          playerMesh.position.copy(safe);
        }
      }

      resolveInitialPlayerSpawn();

      function normalizeInput() {
        const x = (keys.right ? 1 : 0) - (keys.left ? 1 : 0) + joystick.x;
        const z = (keys.forward ? 1 : 0) - (keys.back ? 1 : 0) - joystick.y;
        const vec = new THREE.Vector2(x, z);
        if (vec.length() > 1) vec.normalize();
        return vec;
      }

      function collidesWithWall(nextPos, radius) {
        for (const wall of walls) {
          const halfW = wall.userData.size.w / 2;
          const halfD = wall.userData.size.d / 2;
          const minX = wall.position.x - halfW - radius;
          const maxX = wall.position.x + halfW + radius;
          const minZ = wall.position.z - halfD - radius;
          const maxZ = wall.position.z + halfD + radius;
          if (nextPos.x > minX && nextPos.x < maxX && nextPos.z > minZ && nextPos.z < maxZ) {
            return true;
          }
        }
        return false;
      }

      function movePlayer(dt) {
        const input = normalizeInput();
        if (input.lengthSq() === 0) return;

        const next = playerMesh.position.clone();
        next.x += input.x * player.speed * dt;
        if (!collidesWithWall(next, player.radius)) {
          playerMesh.position.x = next.x;
        }

        next.copy(playerMesh.position);
        next.z += input.y * player.speed * dt;
        if (!collidesWithWall(next, player.radius)) {
          playerMesh.position.z = next.z;
        }
      }

      function shootFrom(origin, dir, list, speed, color, damage) {
        const bullet = new THREE.Mesh(
          new THREE.SphereGeometry(0.16, 10, 8),
          new THREE.MeshStandardMaterial({ color })
        );
        bullet.position.copy(origin);
        bullet.userData = { velocity: dir.clone().multiplyScalar(speed), lifetime: 3, damage };
        scene.add(bullet);
        list.push(bullet);
      }

      function firePlayer() {
        if (player.fireCooldown > 0 || gameWon || gameLost) return;
        const origin = playerMesh.position.clone().add(new THREE.Vector3(0, 1.1, -0.8));

        let target = new THREE.Vector3(0, 0, -1);
        if (enemies[0]) {
          const nearest = enemies
            .slice()
            .sort((a, b) => a.position.distanceToSquared(playerMesh.position) - b.position.distanceToSquared(playerMesh.position))[0];
          target = nearest.position.clone().sub(playerMesh.position).normalize();
        }

        shootFrom(origin, target, playerBullets, 24, 0x0d0d0d, 1);
        player.fireCooldown = 0.35;
      }

      function enemyShoot(enemy) {
        const origin = enemy.position.clone().add(new THREE.Vector3(0, 1.1, 0));
        const dir = playerMesh.position.clone().sub(enemy.position).normalize();
        shootFrom(origin, dir, enemyBullets, 11, 0xff9f1a, 9);
      }

      function updateEnemies(dt) {
        for (const enemy of enemies) {
          const toPlayer = playerMesh.position.clone().sub(enemy.position);
          const dist = toPlayer.length();

          if (dist > 6) {
            const dir = toPlayer.normalize();
            const next = enemy.position.clone().add(dir.multiplyScalar(enemy.userData.speed * dt));
            if (!collidesWithWall(next, enemy.userData.radius)) {
              enemy.position.copy(next);
            }
          }

          enemy.lookAt(playerMesh.position.x, enemy.position.y + 0.8, playerMesh.position.z);
          enemy.userData.shootTimer -= dt;
          if (enemy.userData.shootTimer <= 0 && dist < 24) {
            enemyShoot(enemy);
            enemy.userData.shootTimer = 1.8 + Math.random() * 1.3;
          }
        }
      }

      function updateBullets(list, dt, hitTargetFn) {
        for (let i = list.length - 1; i >= 0; i--) {
          const bullet = list[i];
          bullet.position.addScaledVector(bullet.userData.velocity, dt);
          bullet.userData.lifetime -= dt;

          const hitWall = collidesWithWall(bullet.position, 0.12);
          if (hitWall || bullet.userData.lifetime <= 0 || hitTargetFn(bullet)) {
            scene.remove(bullet);
            list.splice(i, 1);
          }
        }
      }

      function handlePlayerHits(bullet) {
        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemy = enemies[i];
          if (bullet.position.distanceTo(enemy.position.clone().add(new THREE.Vector3(0, 1, 0))) < 1) {
            enemy.userData.health -= bullet.userData.damage;
            if (enemy.userData.health <= 0) {
              scene.remove(enemy);
              enemies.splice(i, 1);
              remainingEl.textContent = String(enemies.length);
            }
            return true;
          }
        }
        return false;
      }

      function handleEnemyHits(bullet) {
        if (bullet.position.distanceTo(playerMesh.position.clone().add(new THREE.Vector3(0, 1, 0))) < 0.95) {
          player.health = Math.max(0, player.health - bullet.userData.damage);
          healthEl.textContent = String(player.health);
          return true;
        }
        return false;
      }

      function updateWinLose() {
        if (!gameWon && !gameLost && player.health <= 0) {
          gameLost = true;
          statusEl.textContent = 'Perdu ! Les voleurs vous ont arrêté.';
        }

        const atExit = playerMesh.position.x > 19 && playerMesh.position.z > 11;
        if (!gameWon && !gameLost && enemies.length === 0 && atExit) {
          gameWon = true;
          statusEl.textContent = 'Bravo ! Tous les voleurs sont neutralisés, sortie atteinte.';
        } else if (!gameWon && !gameLost && enemies.length === 0) {
          statusEl.textContent = 'Aucun voleur restant : allez vers la zone "Sortie".';
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(0.04, clock.getDelta());

        if (!gameWon && !gameLost) {
          player.fireCooldown = Math.max(0, player.fireCooldown - dt);
          movePlayer(dt);
          updateEnemies(dt);
          updateBullets(playerBullets, dt, handlePlayerHits);
          updateBullets(enemyBullets, dt, handleEnemyHits);
          updateWinLose();
        }

        camera.position.lerp(new THREE.Vector3(playerMesh.position.x, 5.8, playerMesh.position.z + 7.5), 0.08);
        camera.lookAt(playerMesh.position.x, 0.9, playerMesh.position.z);

        renderer.render(scene, camera);
      }

      const keyBindings = {
        ArrowUp: 'forward',
        ArrowDown: 'back',
        ArrowLeft: 'left',
        ArrowRight: 'right',
        KeyW: 'forward',
        KeyS: 'back',
        KeyA: 'left',
        KeyD: 'right',
        KeyZ: 'forward',
        KeyQ: 'left',
      };

      function onKey(event, down) {
        const mappedAction = keyBindings[event.code] || keyBindings[event.key];
        if (mappedAction) {
          keys[mappedAction] = down;
          event.preventDefault();
        }

        if (down && (event.code === 'Space' || event.key === ' ')) {
          firePlayer();
          event.preventDefault();
        }
      }

      window.addEventListener('keydown', (e) => onKey(e, true));
      window.addEventListener('keyup', (e) => onKey(e, false));

      fireBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        firePlayer();
      });

      joystickBase.addEventListener('pointerdown', (e) => {
        joystick.active = true;
        joystick.pointerId = e.pointerId;
        joystickBase.setPointerCapture(e.pointerId);
      });

      joystickBase.addEventListener('pointermove', (e) => {
        if (!joystick.active || e.pointerId !== joystick.pointerId) return;
        const rect = joystickBase.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;
        const max = rect.width * 0.34;
        const len = Math.hypot(dx, dy);
        const clamped = len > max ? max / len : 1;
        const nx = (dx * clamped) / max;
        const ny = (dy * clamped) / max;

        joystick.x = nx;
        joystick.y = ny;
        joystickStick.style.transform = `translate(${nx * max}px, ${ny * max}px)`;
      });

      function resetJoystick(e) {
        if (!joystick.active || e.pointerId !== joystick.pointerId) return;
        joystick.active = false;
        joystick.pointerId = null;
        joystick.x = 0;
        joystick.y = 0;
        joystickStick.style.transform = 'translate(0px, 0px)';
      }

      joystickBase.addEventListener('pointerup', resetJoystick);
      joystickBase.addEventListener('pointercancel', resetJoystick);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      window.__gameDebug = {
        getPlayerPosition: () => ({
          x: playerMesh.position.x,
          y: playerMesh.position.y,
          z: playerMesh.position.z,
        }),
      };

      animate();
    </script>
  </body>
</html>
